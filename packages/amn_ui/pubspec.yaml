name: amn_ui
description: "AMN Drift: the app's design system (drifting sky, glass, theme)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/drift.frag
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
